<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Consultation - HealthCare+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-100 flex flex-col h-screen overflow-hidden">

    <!-- Top Bar -->
    <header class="bg-gray-900 border-b border-gray-800 flex-shrink-0">
        <div class="px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center">
                <a href="doctor-dashboard.html" class="text-gray-400 hover:text-white mr-4">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                </a>
                <span class="text-white font-medium">Active Consultation: John Doe</span>
                <span class="ml-4 px-2 py-1 rounded bg-blue-900 text-blue-200 text-xs font-bold uppercase tracking-wider">Telemedicine</span>
            </div>
            <div class="flex items-center text-red-500 font-mono font-bold">
                00:15:32
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Video Stream Area -->
        <div class="flex-1 bg-black relative">
            <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?ixlib=rb-1.2.1&auto=format&fit=crop&w=1000&q=80" class="w-full h-full object-cover opacity-80" alt="Patient Video Stream">
            
            <!-- Doctor PiP -->
            <div class="absolute bottom-6 right-6 w-48 h-32 bg-gray-800 border-2 border-gray-600 rounded-lg overflow-hidden shadow-lg">
                <img src="https://images.unsplash.com/photo-1612349317150-e413f6a5b16d?ixlib=rb-1.2.1&auto=format&fit=crop&w=300&q=80" class="w-full h-full object-cover" alt="Doctor Video Stream">
            </div>

            <!-- Controls -->
            <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 flex space-x-4">
                <button class="p-4 rounded-full bg-gray-800 hover:bg-gray-700 text-white shadow-lg transition focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                    </svg>
                </button>
                <button class="p-4 rounded-full bg-gray-800 hover:bg-gray-700 text-white shadow-lg transition focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </button>
                <button class="p-4 rounded-full bg-red-600 hover:bg-red-700 text-white shadow-lg transition focus:outline-none">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Medical Record Entry Panel -->
        <div class="w-1/3 bg-white border-l border-gray-200 flex flex-col shadow-xl">
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <h2 class="text-lg font-bold text-gray-900">Medical Record Entry</h2>
                <p class="text-xs text-gray-500">Patient: John Doe • 32M</p>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1">
                <form class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Chief Complaint</label>
                        <textarea rows="2" class="mt-1 shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border" readonly>Mild chest pain and shortness of breath over the last two days.</textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Diagnosis (ICD-10)</label>
                        <input type="text" class="mt-1 shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border" placeholder="Search ICD-10 code...">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Prescription</label>
                        <textarea rows="3" class="mt-1 shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border" placeholder="Enter medications and dosage..."></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Clinical Notes</label>
                        <textarea rows="4" class="mt-1 shadow-sm focus:ring-primary-500 focus:border-primary-500 block w-full sm:text-sm border-gray-300 rounded-md p-2 border" placeholder="Examination findings, recommendations..."></textarea>
                    </div>
                </form>
            </div>

            <div class="p-4 border-t border-gray-200 bg-gray-50 flex justify-end space-x-3">
                <button type="button" class="px-4 py-2 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    Save Draft
                </button>
                <a href="doctor-dashboard.html" class="px-4 py-2 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
                    End Consult & Save Record
                </a>
            </div>
        </div>
    </div>
</body>
</html>
