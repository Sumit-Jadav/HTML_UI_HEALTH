<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - MediConnect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .gradient-primary {
            background: linear-gradient(135deg, #5b3db3 0%, #a855d8 100%);
        }
    </style>
</head>
<body class="font-sans antialiased bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="w-10 h-10 gradient-primary rounded-lg flex items-center justify-center text-white font-bold">M</div>
                <span class="text-xl font-bold text-gray-900">MediConnect</span>
            </a>
        </div>
    </nav>

    <!-- Signup Container -->
    <section class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">
            <!-- Card -->
            <div class="bg-white rounded-xl shadow-lg p-8">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Create Account</h1>
                    <p class="text-gray-600">Join thousands of patients</p>
                </div>

                <!-- Progress Indicator -->
                <div class="flex items-center justify-between mb-8">
                    <div class="flex-1 h-2 gradient-primary rounded-full"></div>
                    <div class="flex-1 h-2 bg-gray-300 rounded-full ml-2"></div>
                </div>

                <!-- Step 1: Basic Info -->
                <div id="step1" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                        <input type="text" placeholder="John Doe" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <input type="email" placeholder="you@example.com" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">User Type</label>
                        <select class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                            <option>Select your role</option>
                            <option>Patient</option>
                            <option>Doctor</option>
                        </select>
                    </div>

                    <button type="button" onclick="nextStep()" class="w-full gradient-primary text-white py-3 rounded-lg font-semibold hover:shadow-lg transition mt-6">Next Step</button>
                </div>

                <!-- Step 2: Password Setup -->
                <div id="step2" class="space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                        <div class="mt-2 h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div id="passwordStrength" class="h-full bg-red-500 w-1/3 rounded-full transition-all"></div>
                        </div>
                        <p class="text-xs text-gray-600 mt-1">Password strength: <span id="strengthText">Weak</span></p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                        <input type="password" placeholder="••••••••" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-600">
                    </div>

                    <div class="flex items-start">
                        <input type="checkbox" id="terms" class="w-4 h-4 text-purple-600 rounded mt-1">
                        <label for="terms" class="ml-2 text-sm text-gray-600">I agree to the <a href="#" class="text-purple-600 hover:underline">Terms & Conditions</a></label>
                    </div>

                    <div class="flex gap-3">
                        <button type="button" onclick="previousStep()" class="flex-1 border border-gray-300 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-50 transition">Back</button>
                        <button type="submit" class="flex-1 gradient-primary text-white py-3 rounded-lg font-semibold hover:shadow-lg transition">Create Account</button>
                    </div>
                </div>

                <!-- Footer Links -->
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        Already have an account? 
                        <a href="login.html" class="text-purple-600 font-medium hover:underline">Sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script>
        function nextStep() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function previousStep() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step1').classList.remove('hidden');
        }

        document.getElementById('password')?.addEventListener('input', function() {
            const strength = calculatePasswordStrength(this.value);
            const strengthBar = document.getElementById('passwordStrength');
            const strengthText = document.getElementById('strengthText');
            
            let width = '33%';
            let text = 'Weak';
            let color = 'bg-red-500';
            
            if (strength > 60) {
                width = '100%';
                text = 'Strong';
                color = 'bg-green-500';
            } else if (strength > 30) {
                width = '66%';
                text = 'Medium';
                color = 'bg-yellow-500';
            }
            
            strengthBar.className = `h-full ${color} w-[${width}] rounded-full transition-all`;
            strengthText.textContent = text;
        });

        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength += 20;
            if (password.match(/[a-z]/)) strength += 20;
            if (password.match(/[A-Z]/)) strength += 20;
            if (password.match(/[0-9]/)) strength += 20;
            if (password.match(/[^a-zA-Z0-9]/)) strength += 20;
            return strength;
        }
    </script>
</body>
</html>
